name: Render and Publish Quarto Book

on:
  push:
    branches:
      - main   # change this if your default branch has a different name

# Allow this workflow to write to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (needed for PDF rendering)
        run: quarto install tinytex --no-prompt

      - name: Install EB Garamond font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond
          fc-cache -f -v

      - name: Render the book (HTML and PDF)
        run: quarto render

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book
