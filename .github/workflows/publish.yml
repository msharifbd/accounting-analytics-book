name: Render and Publish Quarto Book

on:
  push:
    branches:
      - main   # change this if your default branch has a different name

# Allow this workflow to write to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # CHANGED: uv replaces setup-python and pip
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # CHANGED: install from pyproject.toml + uv.lock
      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (needed for PDF rendering)
        run: quarto install tinytex --no-prompt

      - name: Install EB Garamond font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond
          fc-cache -f -v

      # CHANGED: run Quarto inside the uv environment
      - name: Render the book (HTML and PDF)
        run: uv run quarto render

      - name: Disable Jekyll processing on GitHub Pages
        run: touch _book/.nojekyll

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book